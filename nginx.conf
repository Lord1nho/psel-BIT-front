server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # React Router: qualquer rota da SPA cai no index.html.
  location / {
    try_files $uri /index.html;
  }

  # Arquivos com hash no nome podem ser cacheados por muito tempo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
